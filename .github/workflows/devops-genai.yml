name: DevOps + GenAI (Ollama local)

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  issues: write

jobs:
  testes_e_ia:
    name: Testar e analisar com Ollama
    # RESTRIÇÃO: somente PRs de branches do próprio repositório,
    # disparados pelo proprietário. Nunca use em PRs de terceiros.
    if: >-
      ${{ github.event.pull_request.head.repo.full_name == github.repository && github.actor == github.repository_owner }}
    runs-on: [self-hosted, linux, devops-genai-ollama]
    timeout-minutes: 25

    steps:
      - name: Baixar codigo do Pull Request
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Criar ambiente virtual e instalar dependencias
        shell: bash
        run: |
          python3 --version
          python3 -m venv .venv-ci
          .venv-ci/bin/python -m pip install -r requirements.txt

      - name: Validar Ollama local e modelo
        shell: bash
        env:
          OLLAMA_MODEL: qwen2.5-coder:3b-instruct
        run: |
          curl --fail --silent --show-error http://127.0.0.1:11434/api/tags > /dev/null
          ollama show "$OLLAMA_MODEL" > /dev/null
          echo "Ollama e modelo disponiveis no computador executor."

      - name: Executar testes e salvar logs
        id: testes
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          .venv-ci/bin/python -m pytest -v --tb=short 2>&1 | tee pytest.log

      - name: Analisar falha com Ollama e comentar no PR
        if: ${{ !cancelled() && steps.testes.outcome == 'failure' }}
        shell: bash
        env:
          OLLAMA_MODEL: qwen2.5-coder:3b-instruct
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .venv-ci/bin/python genai_analyst.py

      - name: Preservar status de falha dos testes
        if: ${{ !cancelled() && steps.testes.outcome == 'failure' }}
        shell: bash
        run: |
          echo 'Testes falharam. A analise de IA nao equivale a uma correcao.'
          exit 1

      - name: Limpar arquivos temporarios
        if: always()
        shell: bash
        run: |
          rm -rf .venv-ci
          rm -f pytest.log
