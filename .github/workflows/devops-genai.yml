name: DevOps + GenAI Lab

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  issues: write

jobs:
  testes_e_ia:
    name: Testar e analisar com IA
    # Laboratório privado: não executar código e segredos a partir de forks.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar código do Pull Request
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Executar testes e salvar logs
        id: testes
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -v --tb=short 2>&1 | tee pytest.log

      - name: Analisar falha com GenAI e comentar no PR
        if: ${{ steps.testes.outcome == 'failure' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-6-luna
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python genai_analyst.py

      - name: Preservar status de falha dos testes
        if: ${{ !cancelled() && steps.testes.outcome == 'failure' }}
        run: |
          echo 'Os testes falharam. A sugestão da IA não equivale a uma correção.'
          exit 1
